[profile.default]
ffi = true

fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
    { access = "write", path = "./contracts.json" },
]

remappings = [
  "forge-std=lib/forge-std/src/",
  "foundry-huff=lib/foundry-huff/src/",
  "foundry-devops=lib/foundry-devops/src/",
]
