services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - 5173:80
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    volumes:
      - ./app.sqlite:/opt/app/app.sqlite
    environment:
      SECRET: When-life-gives-you-lemons,-don't-make-lemonade.-Make-life-take-the-lemons-back!-Get-mad!-I-don't-want-your-damn-lemons,-what-the-hell-am-I-supposed-to-do-with-these?-Demand-to-see-life's-manager!-Make-life-rue-the-day-it-thought-it-could-give-Cave-Johnson-lemons!-Do-you-know-who-I-am?-I'm-the-man-who's-gonna-burn-your-house-down!-With-the-lemons!-I'm-gonna-get-my-engineers-to-invent-a-combustible-lemon-that-burns-your-house-down!
      FLAG: NNS{demo-flag}
  admin-bot:
    build:
      context: admin-bot
      dockerfile: Dockerfile
    depends_on:
      - backend
      - frontend
    environment:
      UI_URL: http://frontend
      API_URL: http://backend:8000
      FLAG: NNS{demo-flag}
