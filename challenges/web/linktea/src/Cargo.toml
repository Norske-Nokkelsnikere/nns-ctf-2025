[package]
authors = ["nnsctf.no", "piprett"]
description = "Challenge source for the Linktea challenge"
edition = "2021"
name = "linktea"
version = "0.1.0"

[dependencies]
axum = {version = "0.8.4", features = ["macros"]}
axum-extra = {version = "0.10.1", features = ["cookie"]}
bon = "3.6.5"
chromiumoxide = {git = "https://github.com/mattsse/chromiumoxide", branch = "main", features = [
  "tokio-runtime",
], default-features = false}
chrono = "0.4.41"
futures = "0.3.31"
jsonwebtoken = "9.3.1"
memory-serve = "1.2.1"
rand = {version = "0.9.2", features = ["std_rng"]}
regex = "1.11.1"
serde = {version = "1.0.219", features = ["derive"]}
sqlx = {version = "0.8.6", features = ["chrono", "derive", "macros", "migrate", "runtime-tokio", "sqlite"]}
tokio = {version = "1.46.1", features = ["full"]}
tower-http = {version = "0.6.6", features = ["timeout", "trace"]}
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
urlencoding = "2.1.3"
validator = {version = "0.20.0", features = ["derive"]}

[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
